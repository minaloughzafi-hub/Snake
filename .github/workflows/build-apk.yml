name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare web files and icons
        run: |
          pip install pillow
          mkdir -p www
          cp index.html manifest.json sw.js www/
          python make-icons.py

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Prepare Android (icons, splash, orientation)
        run: node prepare-android.js

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk snake-counter.apk

      - name: Upload APK (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: snake-counter-apk
          path: snake-counter.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Snake Counter v${{ github.run_number }}
          files: snake-counter.apk
          make_latest: true
